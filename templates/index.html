{% load static %}
{% include "base.html" %}
{% include "header.html" %}

<div class="hero">
    <h1>Lost something?<br><span class="gradient">We'll find it.</span></h1>
    <p>Report lost items, browse found items, and reunite with your belongings.</p>
    <div class="actions">
        <a href="/reportLost/" class="btn btn-primary">Report Lost</a>
        <a href="/reportFound/" class="btn btn-outline">Report Found</a>
    </div>
</div>

<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px;">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; margin-bottom: 40px;">
        <div class="card" style="text-align: center; padding: 32px 20px;">          
            <h3 style="font-weight: 700;">Browse listings</h3>
            <p style="color: var(--text-muted); font-size: 14px;">Check if your item was found.</p>
            <div style="display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap;">
                <a href="/lostlist/" class="btn btn-outline" style="font-size: 13px; padding: 8px 20px;">Lost</a>
                <a href="/foundList/" class="btn btn-outline" style="font-size: 13px; padding: 8px 20px;">Found</a>
            </div>
        </div>
    </div>
</div>

{% include "footer.html" %}
